name: Aether Hub Windows build
# check:   every push to main/master and every pull request. Type check, logic tests, production frontend build and the
#          Rust tests (including the permission-list test), all with the locked dependency files.
# package: manual runs ("Run workflow") and v* tags only, because the release build is slow. Builds the executable and
#          the offline installer, then installs and starts them as a first end-to-end check.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend type check
        run: pnpm run typecheck
      - name: Frontend logic tests (controller, keyboard, navigation, formatting)
        run: pnpm run test:logic
      - name: Production frontend build
        run: pnpm run build
      - name: Generate original native icons
        run: pnpm run desktop:icons
      - name: Native tests (includes the command permission list)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  package:
    needs: check
    # A manual run builds the installer even when check failed (so there is something to try); a tag release needs check to pass.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Record the check result in the run summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Build after a check job result of ${{ needs.check.result }}. An installer built after a failed check is for trying only, not for release."
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native executable and offline setup
        run: pnpm run desktop:build
      - name: Collect executable, installer and checksums
        shell: pwsh
        run: |
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # tauri build renames the binary to mainBinaryName ("Aether Hub"); fall back to the Cargo name if it did not
          $exe = @('Aether Hub.exe', 'aether-hub.exe') | ForEach-Object { Join-Path $release $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No app executable found in $release" }
          Copy-Item $exe 'artifacts/Aether Hub.exe'
          $installers = @(Get-ChildItem "$release/bundle/nsis" -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'The NSIS installer was not produced' }
          $installers | Copy-Item -Destination artifacts
          Copy-Item docs/INSTALLATION.md artifacts
          Get-ChildItem artifacts -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content 'artifacts/SHA256SUMS.txt'
          Get-ChildItem artifacts | Format-Table Name, Length
      # The two start-up checks are new and have not been run on a runner yet, so a failure here is reported in the run
      # summary without failing the build; read the summary page after every run.
      - name: Start-up check, loose executable
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Exe (Resolve-Path 'artifacts/Aether Hub.exe').Path -Label 'loose executable'
      - name: Start-up check, quiet start in the tray
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/smoke-tray-windows.ps1 -Exe (Resolve-Path 'artifacts/Aether Hub.exe').Path
      - name: Start-up check, after a silent install
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts -Filter '*setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No setup executable in artifacts' }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          $null = $install.Handle
          if (-not $install.WaitForExit(300000)) { throw 'The installer did not finish within 5 minutes' }
          "Installer exit code: $($install.ExitCode)"
          $found = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Depth 3 -Filter 'Aether Hub.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Add-Content $env:GITHUB_STEP_SUMMARY '### Start-up check: installed app'; Add-Content $env:GITHUB_STEP_SUMMARY "- FAIL: installer exit code $($install.ExitCode), no installed Aether Hub.exe found"; exit 1 }
          ./scripts/smoke-windows.ps1 -Exe $found.FullName -Label 'installed app'
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Hub-Windows-x64-unsigned
          path: artifacts/
          if-no-files-found: error
